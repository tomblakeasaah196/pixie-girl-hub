<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: when the on-screen keyboard opens,
         the layout viewport shrinks with it, so bottom-pinned composers (CoS
         chat, Messaging) stay visible above the keys instead of hiding under
         them. Ignored by browsers that don't support the key. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0f0809" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pixie Hub" />
    <!-- Static defaults so there's never a /favicon.ico 404; ThemeProvider
         swaps these to the live branding (logo / favicon) once it loads. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS does not reliably render SVG as a home-screen icon, so this
         must be a padded, opaque PNG or Safari falls back to a stretched
         page screenshot. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Dynamic manifest (live product name + icons). Falls back to the
         static /manifest.webmanifest shipped in public/ if the API is
         unavailable at build/host time. -->
    <link rel="manifest" href="/api/public/manifest.webmanifest" />
    <title>Pixie Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Async font CSS: `media="print"` keeps the request from blocking first
         paint (a cross-origin stylesheet fetch can cost seconds on mobile
         data); onload flips it live. display=swap already guarantees text
         renders in a fallback font meanwhile. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,300&family=Inter+Tight:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,300&family=Inter+Tight:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /* Dark background so there's never a white flash before React mounts
         and renders the one real loading screen (BootSplash). */
      body {
        margin: 0;
        background: #0f0809;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
