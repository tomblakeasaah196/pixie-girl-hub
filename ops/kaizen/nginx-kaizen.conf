# Kaizen ops console — nginx server block for kaizen.pixiegirlglobal.com
#
# Serves the static SPA (apps/kaizen/dist) and proxies /api, /media and the
# Socket.io upgrade to the existing Node backend on 127.0.0.1:7000. Adapt the
# cert paths + app root to the target box. See
# docs/KAIZEN_MAINTENANCE_DASHBOARD_IMPLEMENTATION_GUIDE.md §10.2.
#
# ── PANEL / VHOST-EDITOR GOTCHA (CyberPanel/OpenLiteSpeed & similar) ─────────
# Some hosting panels generate the server block from a template with macros
# like {{root}}, {{ssl_certificate}}, {{ssl_certificate_key}}, {{nginx_access_log}}.
# The panel expands {{root}} into its OWN `root ...;` line (the site's default
# docroot). If you ALSO keep the explicit `root .../apps/kaizen/dist;` below you
# get: nginx: [emerg] "root" directive is duplicate → config test fails.
#   Fix: keep exactly ONE root. Either
#     (a) delete the {{root}} macro and keep the explicit dist root (below), or
#     (b) delete the explicit root and set the panel's Document Root to
#         /var/www/pixie-girl-hub/apps/kaizen/dist so {{root}} expands correctly.
# Also watch for paste artifacts (e.g. a stray token after `client_max_body_size
# 20m;`) — nginx rejects unknown directives.

server {
    listen 443 ssl http2;
    server_name kaizen.pixiegirlglobal.com;

    # Reuse the Cloudflare Origin Cert (or wildcard) already on this box.
    ssl_certificate     /etc/ssl/pixiegirlglobal/origin.pem;
    ssl_certificate_key /etc/ssl/pixiegirlglobal/origin.key;

    root /var/www/pixie-girl-hub/apps/kaizen/dist;
    index index.html;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_set_header Host $host;
    }

    # Socket.io (websocket upgrade) — used from Phase 1 onward.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    client_max_body_size 20m;
}

# Redirect plain HTTP → HTTPS (Cloudflare usually handles this; kept for direct
# origin hits).
server {
    listen 80;
    server_name kaizen.pixiegirlglobal.com;
    return 301 https://$host$request_uri;
}
