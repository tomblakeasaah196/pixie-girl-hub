name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys so two runs never race on the same VPS working tree and
# build output. Overlapping `next build`s corrupt apps/landing/.next and make
# the build fail with ENOENT on .next/server/pages-manifest.json. Queue runs
# rather than cancelling — never kill a production deploy mid-flight.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline
        timeout-minutes: 10

      - name: Run tests
        run: npm test --if-present || true
        continue-on-error: true

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: test
    environment: production
    # The VPS pulls this repo over HTTPS with the token forwarded below, so the
    # job's token has to be allowed to read the repository's contents.
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 30
        env:
          # Credentials for the VPS's `git fetch` (see the sync step in the
          # script below). The workflow's own short-lived token is enough to
          # read this repo; set the VPS_GIT_TOKEN secret to a fine-grained PAT
          # instead if the box ever needs to fetch something this token can't
          # reach (a submodule, another private repo).
          DEPLOY_GIT_TOKEN: ${{ secrets.VPS_GIT_TOKEN || github.token }}
          DEPLOY_GIT_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: "28m"
          envs: DEPLOY_GIT_TOKEN,DEPLOY_GIT_REMOTE
          script: |
            set -e

            export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
            export PUPPETEER_SKIP_DOWNLOAD=true
            export NPM_CONFIG_FETCH_TIMEOUT=60000
            export NPM_CONFIG_FETCH_RETRIES=3
            export NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT=60000

            cd /var/www/pixie-girl-hub

            echo "--- Syncing the VPS working tree to origin/main"
            # The VPS is a deploy target, not a dev checkout — never preserve
            # local commits or edits. A plain `git pull` aborts when main has been
            # force-pushed or squash/rebase-merged ("divergent branches need a
            # strategy"), which fails the whole deploy under `set -e`. Fetch and
            # hard-reset so the tree matches origin/main exactly, every time,
            # regardless of the VPS's prior state.
            #
            # Auth: the box holds no GitHub credentials of its own. Its `origin`
            # is an HTTPS URL, so git asks for a username, finds no terminal on
            # this SSH session, and the deploy dies at the first command with
            #   fatal: could not read Username for 'https://github.com':
            #   No such device or address
            # This run therefore carries its own credential: DEPLOY_GIT_TOKEN is
            # forwarded from the workflow (see `envs:` above) and handed to git
            # through a per-invocation credential helper — so it never lands in
            # .git/config or any other file on the box, and it stops working
            # when the run ends. GIT_TERMINAL_PROMPT=0 keeps any future auth
            # failure a fast, honest error instead of that riddle.
            # See docs/DEPLOY_GIT_AUTH.md.
            export GIT_TERMINAL_PROMPT=0
            export GIT_SSH_COMMAND="ssh -o BatchMode=yes"
            GIT_CRED_HELPER='!f() { printf "username=x-access-token\npassword=%s\n" "$DEPLOY_GIT_TOKEN"; }; f'

            # `origin` first (it is the configured remote and may legitimately be
            # SSH); the canonical HTTPS URL of this repo as the fallback, so a
            # stale or unauthenticated remote on the box cannot block a deploy.
            # The refspec updates refs/remotes/origin/main either way, so the
            # hard-reset target below is the same in both cases.
            fetch_main() {
              git -c credential.helper= -c credential.helper="$GIT_CRED_HELPER" \
                  fetch --no-tags "$1" '+refs/heads/main:refs/remotes/origin/main'
            }

            SYNCED=0
            for attempt in 1 2 3 4; do
              if fetch_main origin || fetch_main "$DEPLOY_GIT_REMOTE"; then
                SYNCED=1
                break
              fi
              [ "$attempt" -lt 4 ] || break
              DELAY=$((1 << attempt))
              echo "  fetch attempt $attempt/4 failed — retrying in ${DELAY}s..."
              sleep "$DELAY"
            done

            if [ "$SYNCED" -ne 1 ]; then
              echo "Could not fetch main from GitHub — the VPS tree is untouched."
              echo "  origin: $(git remote get-url origin 2>/dev/null || echo '<none>')"
              echo "  fallback: $DEPLOY_GIT_REMOTE"
              echo "  → GitHub unreachable from the box, or the deploy token"
              echo "    cannot read this repo. See docs/DEPLOY_GIT_AUTH.md."
              exit 1
            fi

            git reset --hard origin/main
            echo "VPS tree now at $(git rev-parse --short HEAD) ✓"

            # ── Headless Chrome for PDF rendering ──────────────────
            # PDFs (invoices, receipts, payslips, reports) render via Puppeteer,
            # which needs a real Chrome/Chromium binary. This VPS deploy installs
            # backend deps with PUPPETEER_SKIP_DOWNLOAD=true (see env above), so
            # Puppeteer does NOT bring its own browser — and the Dockerfile that
            # installs chromium is not used on this host. Without this step the
            # VPS has no Chrome at all and every render fails with "Could not
            # launch Chromium" (API → PDF_UNAVAILABLE, UI → "PDF failed").
            # Install Google Chrome stable once; it lands at
            # /usr/bin/google-chrome-stable (which pdf.service auto-detects) and
            # the .deb pulls in every shared library Chrome needs. Best-effort:
            # a sudo/network hiccup must not fail the whole site deploy.
            echo "--- Ensuring headless Chrome is installed (PDF rendering)"
            if command -v google-chrome-stable >/dev/null 2>&1 \
               || command -v chromium >/dev/null 2>&1 \
               || command -v chromium-browser >/dev/null 2>&1; then
              echo "Chrome/Chromium already present ✓"
            else
              echo "No Chrome found — installing google-chrome-stable"
              CHROME_DEB="$(mktemp --suffix=.deb)"
              if curl -fsSL -o "$CHROME_DEB" \
                   https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
                 && sudo apt-get update -y \
                 && sudo apt-get install -y "$CHROME_DEB"; then
                echo "Installed $(google-chrome-stable --version 2>/dev/null) ✓"
              else
                echo "WARNING: could not install Chrome automatically — PDF"
                echo "rendering stays disabled until a Chrome/Chromium binary is"
                echo "installed on this host. Continuing with the rest of deploy."
              fi
              rm -f "$CHROME_DEB"
            fi

            # ── Backend ────────────────────────────────────────────
            echo "--- Installing backend dependencies"
            npm install --omit=dev

            echo "--- Building the ERP frontend (apps/admin/dist)"
            cd apps/admin
            npm install
            npm run build
            cd ../..

            echo "--- Running migrations"
            NODE_ENV=production node scripts/migrate-shared.js run
            NODE_ENV=production node scripts/repair-business-schema.js --all run

            # ── Pre-order allocation reconcile (safety net) ────────
            # Apply any stock that arrived while a pre-order was waiting but was
            # never drawn/reserved for it — history from before this feature, or
            # anything the live path (worker: stock.received → allocate) missed.
            # Idempotent: coverage is re-derived from the movement ledger, so it
            # only fills a genuine deficit against available stock and a re-run
            # (or the live path having already handled it) is a clean no-op —
            # which is exactly why it is safe to run on every deploy. Best-effort:
            # a hiccup must NOT fail the deploy; the next deploy sweeps again.
            echo "--- Reconciling pre-order allocations (stock that arrived while a pre-order waited)"
            NODE_ENV=production npm run backfill:preorder-allocations \
              || echo "WARNING: pre-order allocation reconcile did not complete — re-run 'npm run backfill:preorder-allocations' on the VPS."

            # ── Praxis AI knowledge refresh ────────────────────────
            # Rebuild Praxis's RAG corpus AFTER migrations so its knowledge of the
            # system (docs + LIVE database schema) matches this deploy — this is
            # what keeps it from answering from a stale/half-built model as the
            # project grows. Best-effort: an embeddings hiccup (rate limit,
            # missing/empty EMBEDDINGS key) must NOT fail a production deploy —
            # the app runs fine without RAG, and ai:reindex is idempotent so it
            # can be re-run by hand. Skips cleanly if no embeddings provider.
            echo "--- Refreshing Praxis AI knowledge (docs + live schema → embeddings)"
            NODE_ENV=production npm run ai:reindex \
              || echo "WARNING: ai:reindex did not complete — Praxis RAG corpus may be stale. Re-run 'npm run ai:reindex' on the VPS."

            echo "--- Zero-downtime reload backend"
            pm2 reload pixie-girl-hub || pm2 start ecosystem.config.js --only pixie-girl-hub --env production

            echo "--- Health check backend"
            PORT=$(grep -E '^PORT=' /var/www/pixie-girl-hub/.env | head -1 \
                   | cut -d '=' -f2 | tr -d ' "')
            PORT=${PORT:-7000}
            echo "Health-checking http://localhost:$PORT/health"

            HEALTHY=0
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:$PORT/health" > /dev/null; then
                echo "Backend health check passed on attempt $i ✓"
                HEALTHY=1
                break
              fi
              echo "  attempt $i/10 — not ready, waiting 3s..."
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Backend health check FAILED"
              pm2 list || true
              pm2 logs pixie-girl-hub --lines 40 --nostream || true
              exit 1
            fi

            echo "--- Verifying the served ERP build matches this commit"
            EXPECTED_BUILD=$(git rev-parse --short HEAD)
            SERVED_HTML=$(curl -s "http://localhost:$PORT/")
            if echo "$SERVED_HTML" | grep -q "x-build\" content=\"$EXPECTED_BUILD\""; then
              echo "Served ERP build matches HEAD ($EXPECTED_BUILD) ✓"
            else
              echo "ERP build verification FAILED"
              echo "  expected build id: $EXPECTED_BUILD"
              echo "  served meta tag:   $(echo "$SERVED_HTML" | grep -o 'x-build" content="[^"]*"' | head -1)"
              echo "  → the origin is serving a stale shell; deploy did not take effect."
              exit 1
            fi

            # ── Landing (Next.js) ──────────────────────────────────
            echo "--- Installing landing dependencies"
            cd apps/landing
            npm install

            echo "--- Building landing app (.next)"
            # Always build from a clean output dir. `git checkout`/`git pull`
            # don't touch .next (it's gitignored), so a stale or half-written
            # .next left by a previous interrupted/overlapping build makes
            # `next build` fail with ENOENT on .next/server/pages-manifest.json.
            rm -rf .next
            npm run build

            cd ../..

            echo "--- Zero-downtime reload landing"
            pm2 reload pixie-girl-landing || pm2 start ecosystem.config.js --only pixie-girl-landing --env production

            echo "--- Saving PM2 process list"
            pm2 save

            echo "--- Health check landing"
            HEALTHY=0
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:3000" > /dev/null; then
                echo "Landing health check passed on attempt $i ✓"
                HEALTHY=1
                break
              fi
              echo "  attempt $i/10 — not ready, waiting 3s..."
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Landing health check FAILED"
              pm2 list || true
              pm2 logs pixie-girl-landing --lines 40 --nostream || true
              exit 1
            fi

            # ── Storefront (TanStack Start / Nitro SSR) ────────────
            # One process serves BOTH brands; brand resolves from the Host
            # header (see docs/STOREFRONT_DEPLOYMENT.md). Build output is the
            # Nitro server in apps/storefront/.output (gitignored, so rebuild
            # from clean every deploy like the landing .next above).
            echo "--- Installing storefront dependencies"
            cd apps/storefront
            npm install

            echo "--- Building storefront app (.output)"
            rm -rf .output
            npm run build

            cd ../..

            echo "--- Zero-downtime reload storefront"
            pm2 reload pixie-girl-storefront || pm2 start ecosystem.config.js --only pixie-girl-storefront --env production

            echo "--- Saving PM2 process list"
            pm2 save

            echo "--- Health check storefront"
            HEALTHY=0
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:3002" > /dev/null; then
                echo "Storefront health check passed on attempt $i ✓"
                HEALTHY=1
                break
              fi
              echo "  attempt $i/10 — not ready, waiting 3s..."
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Storefront health check FAILED"
              pm2 list || true
              pm2 logs pixie-girl-storefront --lines 40 --nostream || true
              exit 1
            fi

            # ── Stylist (TanStack Start / Nitro SSR) ────────────
            # One process serves BOTH brands; brand resolves from the Host
            # Nitro server in apps/stylist/.output (gitignored, so rebuild
            # from clean every deploy like the landing .next above).
            echo "--- Installing stylist dependencies"
            cd apps/stylist
            npm install

            echo "--- Building stylist app (.output)"
            rm -rf .output
            npm run build

            cd ../..

            echo "--- Zero-downtime reload stylist"
            pm2 reload pixie-girl-stylist || pm2 start ecosystem.config.js --only pixie-girl-stylist --env production

            echo "--- Saving PM2 process list"
            pm2 save

            echo "--- Health check stylist"
            HEALTHY=0
            for i in $(seq 1 10); do
              if curl -sf "http://localhost:3003" > /dev/null; then
                echo "Stylist health check passed on attempt $i ✓"
                HEALTHY=1
                break
              fi
              echo "  attempt $i/10 — not ready, waiting 3s..."
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "Stylist health check FAILED"
              pm2 list || true
              pm2 logs pixie-girl-stylist --lines 40 --nostream || true
              exit 1
            fi

            # ── Kaizen ops console (static SPA served by nginx) ────
            # Build apps/kaizen/dist so nginx can serve it at
            # kaizen.pixiegirlglobal.com (vhost: ops/kaizen/nginx-kaizen.conf).
            # It's a static SPA — no PM2 process, so no reload/health check here.
            # Placed LAST on purpose: the core ERP + brand sites are already
            # deployed and health-checked above, so a Kaizen build hiccup can
            # never interrupt them. The subdomain only goes live once the
            # Cloudflare record + nginx vhost + KAIZEN_JWT_SECRET are set on the
            # box (see ops/kaizen/README.md); until then this build is harmless.
            echo "--- Building Kaizen ops console (apps/kaizen/dist)"
            cd apps/kaizen
            npm install
            npm run build
            cd ../..

            # # ── Cloudflare inbound-email Worker ────────────────────
            # # Deploy the Email Routing Worker that pipes customer replies into
            # # the Smartcomm inbox. Fully non-interactive: auth via
            # # CLOUDFLARE_API_TOKEN (no `wrangler login`), and the shared HMAC
            # # secret pushed straight from the SAME .env the backend verifies
            # # against (CF_EMAIL_INBOUND_SECRET) — no manual prompt. This is the
            # # ongoing deploy only; the one-time `wrangler login` / Email Routing
            # # wiring in the Cloudflare dashboard is deliberately NOT automated.
            # # Best-effort like Kaizen above: a Cloudflare hiccup, or a box that
            # # simply hasn't set the token yet, must never fail the core deploy.
            # echo "--- Deploying Cloudflare inbound-email Worker"
            # CF_TOKEN=$(grep -E '^CLOUDFLARE_API_TOKEN=' .env | head -1 | cut -d '=' -f2- | tr -d ' "')
            # CF_ACCOUNT=$(grep -E '^CLOUDFLARE_ACCOUNT_ID=' .env | head -1 | cut -d '=' -f2- | tr -d ' "')
            # CF_SECRET=$(grep -E '^CF_EMAIL_INBOUND_SECRET=' .env | head -1 | cut -d '=' -f2- | tr -d ' "')
            # if [ -n "$CF_TOKEN" ] && [ -n "$CF_SECRET" ]; then
            #   (
            #     set -e
            #     cd cloudflare
            #     npm install --no-audit --no-fund
            #     export CLOUDFLARE_API_TOKEN="$CF_TOKEN"
            #     [ -n "$CF_ACCOUNT" ] && export CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT"
            #     # Deploy first so the script exists, then (re)set the secret —
            #     # `secret put` requires the Worker to already be published.
            #     npx --yes wrangler deploy
            #     printf '%s' "$CF_SECRET" | npx --yes wrangler secret put INBOUND_SECRET
            #   ) && echo "Cloudflare Worker deployed ✓" \
            #     || echo "WARNING: Cloudflare Worker deploy did not complete — run 'npm install && npx wrangler deploy' in ./cloudflare on the VPS by hand."
            # else
            #   echo "Skipping Cloudflare Worker deploy — set CLOUDFLARE_API_TOKEN (and optionally CLOUDFLARE_ACCOUNT_ID) plus CF_EMAIL_INBOUND_SECRET in .env to enable."
            # fi

            echo "Production deploy complete ✓"
