# Short customer document links — OPTIONAL nginx snippet for the hub vhost.
#
# The canonical customer-facing URLs are:
#   https://hub.pixiegirlglobal.com/api/public/documents/invoice/<uuid>
#   https://hub.pixiegirlglobal.com/api/public/documents/receipt/<uuid>
# and they work with NO infrastructure change, because every vhost in this
# repo already proxies /api/ to Node (127.0.0.1:7000). See
# docs/STOREFRONT_DEPLOYMENT.md §7 and docs/UPLOAD_SIZE_LIMITS.md.
#
# The backend ALSO serves the same documents at the short root paths
#   /i/<uuid>   (invoice PDF)
#   /r/<uuid>   (receipt PDF)
# which is what the marketing/DM copy prefers. Those only reach Node on hosts
# that proxy everything to it (Docker, local dev). On a host that serves the
# admin SPA for non-/api paths — the hub's current setup — nginx answers
# /i/<uuid> with index.html, and the SPA then redirects the customer on to the
# canonical /api/public URL above, so the customer still gets the PDF either
# way (see apps/admin/src/pages/DocumentLinkRedirect.tsx).
#
# To make the short paths first-class (one less redirect, shorter links in
# emails, WhatsApp notes and IG DMs), add these two blocks to the hub's
# server {} and reload nginx:
#
#     location ~ ^/[ir]/[0-9a-fA-F-]{36}$ {
#         proxy_pass http://127.0.0.1:7000;
#         include /etc/nginx/proxy_params;
#     }
#
# Then `sudo nginx -t && sudo systemctl reload nginx`.
#
# Nothing breaks if you skip it: the links that go out in messages are the
# /api/public ones, which are proxied already.
